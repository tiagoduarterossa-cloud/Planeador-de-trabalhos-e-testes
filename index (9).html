<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#26324A" />
<title>Planeador</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Planeador" />
<style>
  :root {
    --paper: #FAF6EC;
    --ink: #26324A;
    --rule: #DCD3BE;
    --muted: #8A8371;
    --card-border: #EAE3D3;
    --urgent: #B54B3E;
    --soon: #C99A2E;
    --safe: #3F7D6B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: max(28px, env(safe-area-inset-top)) 18px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 32px;
    font-weight: 400;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .divider {
    height: 1px;
    margin-top: 14px;
    background: repeating-linear-gradient(90deg, var(--rule) 0, var(--rule) 6px, transparent 6px, transparent 10px);
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
  .chip {
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--muted);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .chip.active { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  .empty { text-align: center; padding: 48px 20px; color: #8A8371; font-size: 14px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .task {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid var(--card-border);
    border-left: 4px solid; border-radius: 4px; padding: 12px 14px;
  }
  .dot-btn {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid #C7BFA8; background: transparent; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .task-title { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .task-due { font-size: 12.5px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .del-btn { background: transparent; border: none; cursor: pointer; color: #C7BFA8; flex-shrink: 0; padding: 2px; }
  .task-body { flex: 1; min-width: 0; }
  details { margin-top: 22px; }
  summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .done-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; color: #B0A98F; font-size: 13.5px; text-decoration: line-through; }
  .add-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--ink); color: var(--paper); border: none; border-radius: 6px;
    padding: 12px; font-size: 14.5px; font-weight: 500; cursor: pointer; margin-top: 24px; font-family: inherit;
  }
  .form-card { background: #fff; border: 1px solid var(--card-border); border-radius: 6px; padding: 16px; margin-top: 24px; }
  .form-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
  .form-head button { background: transparent; border: none; cursor: pointer; color: var(--muted); font-size: 16px; }
  .field { display: flex; flex-direction: column; gap: 10px; }
  input, select {
    border: 1px solid var(--rule); border-radius: 5px; padding: 9px 10px; font-size: 14px;
    font-family: inherit; color: var(--ink); background: #FDFBF5; outline: none; width: 100%;
  }
  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; }
  .save-btn {
    margin-top: 4px; background: var(--safe); color: #fff; border: none; border-radius: 5px;
    padding: 10px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .save-btn:disabled { background: var(--rule); cursor: default; }
  .banner { background: #F5E4E0; color: #8A3B2E; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .bell-btn {
    display: flex; align-items: center; gap: 6px; background: transparent;
    border: 1px solid var(--rule); border-radius: 20px; padding: 6px 12px;
    font-size: 12.5px; color: var(--muted); cursor: pointer; font-family: inherit; flex-shrink: 0; margin-top: 4px;
  }
  .bell-btn.on { border-color: var(--safe); color: var(--safe); background: #EAF3EF; }
  .info-banner { background: #EFF1E6; color: #5A6350; padding: 8px 12px; border-radius: 6px; font-size: 12.5px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 4px; background: #EFEAD9; border-radius: 8px; padding: 4px; margin-bottom: 18px; }
  .tab-btn {
    flex: 1; border: none; background: transparent; padding: 8px; border-radius: 6px;
    font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; font-family: inherit;
  }
  .tab-btn.active { background: #fff; color: var(--ink); }
  .file-row {
    display: flex; align-items: center; gap: 12px; background: #fff;
    border: 1px solid var(--card-border); border-radius: 4px; padding: 12px 14px; margin-bottom: 10px;
  }
  .file-icon { font-size: 20px; flex-shrink: 0; }
  .file-name { font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .file-actions { display: flex; gap: 10px; flex-shrink: 0; }
  .file-actions a, .file-actions button { background: transparent; border: none; color: #8A8371; cursor: pointer; padding: 2px; }
  .upload-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--safe); color: #fff; border: none; border-radius: 6px;
    padding: 12px; font-size: 14.5px; font-weight: 500; cursor: pointer; margin-top: 8px; font-family: inherit;
  }
  .upload-btn:disabled { background: var(--rule); }
  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-card { max-width: 360px; width: 100%; }
  .login-card h1 { margin-bottom: 6px; }
  .login-card .subtitle { margin-bottom: 24px; }
  .login-field { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .login-btn {
    width: 100%; background: var(--ink); color: var(--paper); border: none; border-radius: 6px;
    padding: 12px; font-size: 14.5px; font-weight: 500; cursor: pointer; font-family: inherit; margin-top: 4px;
  }
  .login-btn:disabled { background: var(--rule); }
  .login-error { color: var(--urgent); font-size: 13px; margin-top: 10px; }
  .logout-btn {
    background: transparent; border: none; color: var(--muted); font-size: 12.5px;
    cursor: pointer; font-family: inherit; text-decoration: underline; padding: 4px 0;
  }
  .search-input {
    width: 100%; border: 1px solid var(--rule); border-radius: 20px; padding: 9px 14px;
    font-size: 14px; font-family: inherit; color: var(--ink); background: #FDFBF5;
    outline: none; margin-bottom: 14px; -webkit-appearance: none;
  }
  .calendar-card {
    background: #1B2340; border-radius: 14px;
    padding: 18px 14px; margin-top: 20px;
  }
  .calendar-header {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 700; margin-bottom: 14px; padding: 0 4px; color: #fff;
  }
  .cal-nav-btn {
    background: transparent; border: none; font-size: 20px; color: #fff;
    cursor: pointer; padding: 0 8px; line-height: 1; font-family: inherit; opacity: 0.7;
  }
  .calendar-weekdays, .calendar-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
  }
  .calendar-weekdays span { font-size: 12px; font-weight: 700; color: #fff; opacity: 0.6; padding-bottom: 10px; }
  .calendar-grid { row-gap: 6px; }
  .cal-day {
    position: relative; aspect-ratio: 1; margin: 0 auto; width: 34px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; border-radius: 50%;
    cursor: pointer; color: #fff; background: transparent; border: none; font-family: inherit;
  }
  .cal-day.other-month { color: #4A5578; font-weight: 500; cursor: default; }
  .cal-day.has-task { color: #fff; }
  .cal-day.today { box-shadow: inset 0 0 0 2px #fff; }
  .cal-day.selected { box-shadow: inset 0 0 0 2px #fff; }
  .cal-filter-note {
    margin-top: 12px; font-size: 12.5px; color: #fff; opacity: 0.75; text-align: center;
  }
  .cal-filter-note button {
    background: transparent; border: none; color: #fff; text-decoration: underline;
    cursor: pointer; font-family: inherit; font-size: 12.5px; padding: 0; margin-left: 4px; opacity: 1;
  }
</style>
</head>
<body>
  <div id="loginScreen" class="login-screen" style="display:none;">
    <div class="login-card">
      <h1>Planeador</h1>
      <p class="subtitle">Inicia sessão para veres os teus trabalhos e ficheiros</p>
      <div class="login-field">
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="username" />
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
      </div>
      <button id="loginBtn" class="login-btn">Entrar</button>
      <div id="loginError" class="login-error" style="display:none;"></div>
    </div>
  </div>

  <div id="appScreen" style="display:none;">
  <div class="wrap">
    <div>
      <div class="header-row">
        <div>
          <h1>Planeador</h1>
          <p class="subtitle">Trabalhos e testes, por ordem de prazo</p>
        </div>
        <button id="bellBtn" class="bell-btn">🔔 Lembretes</button>
      </div>
      <div class="divider"></div>
    </div>

    <div id="offlineBanner" class="banner" style="display:none;">Sem ligação — a mostrar dados guardados no telemóvel.</div>
    <div id="reminderInfo" class="info-banner" style="display:none;"></div>

    <div class="tabs">
      <button id="tabTasks" class="tab-btn active">Trabalhos</button>
      <button id="tabFiles" class="tab-btn">Ficheiros</button>
    </div>

    <div id="tasksView">
      <input id="searchInput" type="search" placeholder="🔍 Procurar por título ou disciplina..." class="search-input" />
      <div id="chips" class="chips"></div>
      <div id="emptyState" class="empty" style="display:none;">Sem nada pendente. Junta o primeiro trabalho ou teste abaixo.</div>
      <div id="list" class="list"></div>

      <details id="doneDetails" style="display:none;">
        <summary id="doneSummary">Concluídos</summary>
        <div id="doneList" style="display:flex;flex-direction:column;gap:6px;margin-top:10px;"></div>
      </details>

      <button id="addBtn" class="add-btn">+ Adicionar trabalho ou teste</button>

      <div id="formCard" class="form-card" style="display:none;">
        <div class="form-head">
          <span>Novo item</span>
          <button id="closeForm">✕</button>
        </div>
      <div class="field">
        <input id="fTitle" placeholder="Título (ex: Trabalho de Físico-Química)" />
        <input id="fSubject" placeholder="Disciplina (ex: Matemática)" />
        <div class="row2">
          <select id="fType">
            <option value="trabalho">Trabalho</option>
            <option value="teste">Teste</option>
          </select>
          <select id="fPriority">
            <option value="baixa">Prioridade baixa</option>
            <option value="media" selected>Prioridade média</option>
            <option value="alta">Prioridade alta</option>
          </select>
        </div>
        <input id="fDate" type="date" />
        <button id="saveBtn" class="save-btn" disabled>Guardar</button>
      </div>
      </div>

      <div class="calendar-card">
        <div class="calendar-header">
          <button id="calPrev" class="cal-nav-btn" aria-label="Mês anterior">‹</button>
          <span id="calLabel"></span>
          <button id="calNext" class="cal-nav-btn" aria-label="Mês seguinte">›</button>
        </div>
        <div class="calendar-weekdays">
          <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
        </div>
        <div id="calGrid" class="calendar-grid"></div>
        <div id="calFilterNote" class="cal-filter-note" style="display:none;"></div>
      </div>
    </div>

    <div id="filesView" style="display:none;">
      <input id="fileSearchInput" type="search" placeholder="🔍 Procurar ficheiro..." class="search-input" />
      <div id="fileList"></div>
      <div id="filesEmpty" class="empty" style="display:none;">Ainda não tens ficheiros guardados.</div>
      <input type="file" id="fileInput" style="display:none;" />
      <button id="uploadBtn" class="upload-btn">📎 Escolher ficheiro para guardar</button>
      <div id="uploadStatus" class="info-banner" style="display:none;"></div>
    </div>

    <div style="text-align:center; margin-top: 24px;">
      <button id="logoutBtn" class="logout-btn">Terminar sessão</button>
    </div>
  </div>
  </div>

<script>
// -- Configuração: preenche estes dois valores depois de criares o projeto Supabase --
// Settings → API no painel do Supabase: "Project URL" e "anon public" key
const SUPABASE_URL = "https://cmljotizbrxpzvwltlxy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_aqqMr-zYhBM3qKdaz7n7iQ_EHGHoDLz";
const VAPID_PUBLIC_KEY = "BO8VwilkLM2idf37YOC4NOhhesKQDjnAn4Zew0H_pg7fPmxaigIoSi6qrr6C0jUYbCF4jiqywk2vnxaE2hnqYPc";

const supabaseReady = SUPABASE_URL.startsWith("http");

// -- Sessão / autenticação --
const SESSION_KEY = "planeador-session";

function getSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { return null; }
}
function setSession(session) {
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}
function sessionValid(session) {
  return session && session.access_token && session.expires_at > Date.now() / 1000;
}

async function login(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || "Email ou password incorretos.");
  setSession(data);
  return data;
}

async function refreshSession(session) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: session.refresh_token }),
  });
  if (!res.ok) throw new Error("sessão expirada");
  const data = await res.json();
  setSession(data);
  return data;
}

async function ensureSession() {
  let session = getSession();
  if (sessionValid(session)) return session;
  if (session && session.refresh_token) {
    try { return await refreshSession(session); } catch (e) { clearSession(); }
  }
  return null;
}

function authHeader() {
  const session = getSession();
  return session && session.access_token ? session.access_token : SUPABASE_ANON_KEY;
}
function getUserId() {
  const session = getSession();
  return session && session.user ? session.user.id : null;
}

async function supabaseRequest(path, options = {}) {
  if (!supabaseReady) return null;
  try {
    return await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${authHeader()}`,
        "Content-Type": "application/json",
        Prefer: options.prefer || "return=minimal",
        ...(options.headers || {}),
      },
    });
  } catch (e) {
    return null; // offline ou Supabase por configurar — a app continua a funcionar localmente
  }
}

function syncTaskRemote(task) {
  supabaseRequest("tasks?on_conflict=id", {
    method: "POST",
    prefer: "resolution=merge-duplicates",
    body: JSON.stringify([{
      id: task.id, title: task.title, subject: task.subject,
      type: task.type, due_date: task.dueDate, priority: task.priority, done: task.done,
      user_id: getUserId(),
    }]),
  });
}
function deleteTaskRemote(id) {
  supabaseRequest(`tasks?id=eq.${id}`, { method: "DELETE" });
}

// Separadores
const tabTasks = document.getElementById("tabTasks");
const tabFiles = document.getElementById("tabFiles");
const tasksView = document.getElementById("tasksView");
const filesView = document.getElementById("filesView");

tabTasks.addEventListener("click", () => {
  tabTasks.classList.add("active");
  tabFiles.classList.remove("active");
  tasksView.style.display = "block";
  filesView.style.display = "none";
});
tabFiles.addEventListener("click", () => {
  tabFiles.classList.add("active");
  tabTasks.classList.remove("active");
  filesView.style.display = "block";
  tasksView.style.display = "none";
  loadFiles();
});

// Ficheiros (Supabase Storage)
const BUCKET = "ficheiros";
const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");
const uploadStatus = document.getElementById("uploadStatus");
const fileList = document.getElementById("fileList");
const filesEmpty = document.getElementById("filesEmpty");

function formatBytes(bytes) {
  if (!bytes) return "";
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

function iconForFile(name) {
  const ext = name.split(".").pop().toLowerCase();
  if (["pdf"].includes(ext)) return "📕";
  if (["doc", "docx"].includes(ext)) return "📄";
  if (["xls", "xlsx"].includes(ext)) return "📊";
  if (["ppt", "pptx"].includes(ext)) return "📽️";
  if (["jpg", "jpeg", "png", "gif", "heic", "webp"].includes(ext)) return "🖼️";
  if (["zip", "rar"].includes(ext)) return "🗜️";
  return "📎";
}

let allFiles = [];
let fileSearchQuery = "";

async function loadFiles() {
  if (!supabaseReady) {
    fileList.innerHTML = "";
    filesEmpty.style.display = "block";
    filesEmpty.textContent = "Liga primeiro o Supabase (configuração em falta).";
    return;
  }
  try {
    const userId = getUserId();
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${authHeader()}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ prefix: `${userId}/`, sortBy: { column: "created_at", order: "desc" } }),
    });
    const items = await res.json();
    allFiles = (Array.isArray(items) ? items : []).filter(f => f.id);
    renderFileList();
  } catch (e) {
    filesEmpty.style.display = "block";
    filesEmpty.textContent = "Não foi possível carregar os ficheiros (sem ligação?).";
  }
}

function renderFileList() {
  const userId = getUserId();
  const q = fileSearchQuery.trim().toLowerCase();
  const files = allFiles.filter(f => !q || f.name.toLowerCase().includes(q));
  fileList.innerHTML = "";
  if (allFiles.length === 0) {
    filesEmpty.style.display = "block";
    filesEmpty.textContent = "Ainda não tens ficheiros guardados.";
  } else if (files.length === 0) {
    filesEmpty.style.display = "block";
    filesEmpty.textContent = "Nenhum ficheiro corresponde à pesquisa.";
  } else {
    filesEmpty.style.display = "none";
  }

  {
    files.forEach(f => {
      const fullPath = `${userId}/${f.name}`;
      const size = f.metadata ? formatBytes(f.metadata.size) : "";
      const row = document.createElement("div");
      row.className = "file-row";
      row.innerHTML = `
        <span class="file-icon">${iconForFile(f.name)}</span>
        <div style="flex:1; min-width:0;">
          <div class="file-name">${escapeHtml(f.name)}</div>
          <div class="file-meta">${size}</div>
        </div>
        <div class="file-actions">
          <button data-path="${escapeHtml(fullPath)}" class="open-file-btn" aria-label="Abrir">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
          <button data-path="${escapeHtml(fullPath)}" class="delete-file-btn" aria-label="Apagar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      `;
      fileList.appendChild(row);
    });

    document.querySelectorAll(".open-file-btn").forEach(btn => {
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          const encodedPath = btn.dataset.path.split("/").map(encodeURIComponent).join("/");
          const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${BUCKET}/${encodedPath}`, {
            method: "POST",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${authHeader()}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ expiresIn: 120 }),
          });
          const data = await res.json();
          if (data.signedURL) {
            window.location.href = `${SUPABASE_URL}/storage/v1${data.signedURL}`;
          }
        } catch (e) {}
        btn.disabled = false;
      };
    });

    document.querySelectorAll(".delete-file-btn").forEach(btn => {
      btn.onclick = async () => {
        const path = btn.dataset.path;
        if (!confirm(`Apagar este ficheiro?`)) return;
        await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`, {
          method: "DELETE",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${authHeader()}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ prefixes: [path] }),
        });
        loadFiles();
      };
    });
  }
}

const fileSearchInput = document.getElementById("fileSearchInput");
fileSearchInput.addEventListener("input", () => {
  fileSearchQuery = fileSearchInput.value;
  renderFileList();
});

uploadBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file || !supabaseReady) return;
  uploadBtn.disabled = true;
  uploadStatus.style.display = "block";
  uploadStatus.textContent = `A enviar "${file.name}"...`;
  try {
    const safeName = `${getUserId()}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
    const buffer = await file.arrayBuffer(); // corrige um bug do Safari que envia o ficheiro vazio
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${safeName}`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${authHeader()}`,
        "Content-Type": file.type || "application/octet-stream",
      },
      body: buffer,
    });
    if (res.ok) {
      uploadStatus.textContent = "Ficheiro guardado!";
      loadFiles();
    } else {
      uploadStatus.textContent = "Não foi possível enviar o ficheiro.";
    }
  } catch (e) {
    uploadStatus.textContent = "Erro ao enviar — verifica a ligação.";
  }
  uploadBtn.disabled = false;
  fileInput.value = "";
  setTimeout(() => { uploadStatus.style.display = "none"; }, 3000);
});

const SUBJECT_COLORS = ["#4C6B8A","#8A4C6B","#4C8A6E","#8A6B4C","#7A5C8A","#3F7D8A"];
const STORAGE_KEY = "planeador-tasks";

let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let filterSubject = "Todas";
let searchQuery = "";
let selectedDay = null; // "YYYY-MM-DD" ou null
let calendarMonth = new Date(); calendarMonth.setDate(1);

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); render(); }

function knownSubjects() { return [...new Set(tasks.map(t => t.subject))]; }
function colorForSubject(subject) {
  const known = knownSubjects();
  const idx = known.indexOf(subject);
  return SUBJECT_COLORS[(idx >= 0 ? idx : known.length) % SUBJECT_COLORS.length];
}
function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dateStr + "T00:00:00");
  return Math.round((due - today) / 86400000);
}
function formatDue(dateStr) {
  const d = daysUntil(dateStr);
  if (d < 0) return `Atrasado ${Math.abs(d)}d`;
  if (d === 0) return "Hoje";
  if (d === 1) return "Amanhã";
  return `Em ${d} dias`;
}
function urgencyColor(dateStr) {
  const d = daysUntil(dateStr);
  if (d <= 1) return "#B54B3E";
  if (d <= 4) return "#C99A2E";
  return "#3F7D6B";
}

function render() {
  const chips = document.getElementById("chips");
  const known = knownSubjects();
  chips.innerHTML = "";
  if (known.length > 0) {
    ["Todas", ...known].forEach(s => {
      const b = document.createElement("button");
      b.className = "chip" + (filterSubject === s ? " active" : "");
      b.textContent = s;
      b.onclick = () => { filterSubject = s; render(); };
      chips.appendChild(b);
    });
  }

  const q = searchQuery.trim().toLowerCase();
  const visible = tasks.filter(t => {
    if (t.done) return false;
    if (filterSubject !== "Todas" && t.subject !== filterSubject) return false;
    if (selectedDay && t.dueDate !== selectedDay) return false;
    if (q && !t.title.toLowerCase().includes(q) && !t.subject.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b) => a.dueDate.localeCompare(b.dueDate));
  const list = document.getElementById("list");
  list.innerHTML = "";
  document.getElementById("emptyState").style.display = (tasks.length === 0) ? "block" : "none";

  visible.forEach(t => {
    const color = colorForSubject(t.subject);
    const uColor = urgencyColor(t.dueDate);
    const row = document.createElement("div");
    row.className = "task";
    row.style.borderLeftColor = color;
    row.innerHTML = `
      <button class="dot-btn" data-id="${t.id}" data-action="toggle">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#C7BFA8" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <div class="task-body">
        <div class="task-title">${escapeHtml(t.title)}</div>
        <div class="task-meta">
          <span style="color:${color}">${escapeHtml(t.subject)}</span> ·
          <span>${t.type === "teste" ? "Teste" : "Trabalho"}</span>
          ${t.priority === "alta" ? ' · <span style="color:#B54B3E">prioridade alta</span>' : ""}
        </div>
      </div>
      <div class="task-due" style="color:${uColor}">${formatDue(t.dueDate)}</div>
      <button class="del-btn" data-id="${t.id}" data-action="delete">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    `;
    list.appendChild(row);
  });

  const done = tasks.filter(t => t.done).sort((a,b) => b.dueDate.localeCompare(a.dueDate));
  const doneDetails = document.getElementById("doneDetails");
  doneDetails.style.display = done.length > 0 ? "block" : "none";
  document.getElementById("doneSummary").textContent = `Concluídos (${done.length})`;
  const doneList = document.getElementById("doneList");
  doneList.innerHTML = "";
  done.forEach(t => {
    const row = document.createElement("div");
    row.className = "done-row";
    row.innerHTML = `
      <button class="dot-btn" data-id="${t.id}" data-action="toggle" style="border:none;background:#3F7D6B;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <span style="flex:1;">${escapeHtml(t.title)}</span>
      <button class="del-btn" data-id="${t.id}" data-action="delete">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    `;
    doneList.appendChild(row);
  });

  document.querySelectorAll("[data-action]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.id, action = el.dataset.action;
      if (action === "toggle") {
        tasks = tasks.map(t => t.id === id ? {...t, done: !t.done} : t);
        const updated = tasks.find(t => t.id === id);
        if (updated) syncTaskRemote(updated);
      }
      if (action === "delete") {
        tasks = tasks.filter(t => t.id !== id);
        deleteTaskRemote(id);
      }
      save();
    };
  });

  renderCalendar();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

const MONTH_NAMES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function toDateStr(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

const CAL_COLORS = ["#C0392B","#D68910","#229954","#8E44AD","#2980B9","#E67E22","#16A085"];

function renderCalendar() {
  const grid = document.getElementById("calGrid");
  const label = document.getElementById("calLabel");
  if (!grid || !label) return;

  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  label.textContent = `${MONTH_NAMES[month]} ${year}`;

  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const todayStr = toDateStr(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  const datesWithTasks = new Set(tasks.filter(t => !t.done).map(t => t.dueDate));

  grid.innerHTML = "";
  const totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - firstWeekday + 1;
    let cellDate, otherMonth = false;
    if (dayNum < 1) {
      cellDate = toDateStr(month === 0 ? year - 1 : year, month === 0 ? 11 : month - 1, daysInPrevMonth + dayNum);
      otherMonth = true;
    } else if (dayNum > daysInMonth) {
      cellDate = toDateStr(month === 11 ? year + 1 : year, month === 11 ? 0 : month + 1, dayNum - daysInMonth);
      otherMonth = true;
    } else {
      cellDate = toDateStr(year, month, dayNum);
    }

    const hasTask = datesWithTasks.has(cellDate);
    const btn = document.createElement("button");
    btn.className = "cal-day"
      + (otherMonth ? " other-month" : "")
      + (hasTask && !otherMonth ? " has-task" : "")
      + (cellDate === todayStr ? " today" : "")
      + (cellDate === selectedDay ? " selected" : "");
    if (hasTask && !otherMonth) {
      const dayOfMonth = parseInt(cellDate.slice(-2), 10);
      btn.style.background = CAL_COLORS[dayOfMonth % CAL_COLORS.length];
    }
    btn.textContent = cellDate.slice(-2).replace(/^0/, "");
    btn.onclick = () => {
      selectedDay = (selectedDay === cellDate) ? null : cellDate;
      render();
    };
    grid.appendChild(btn);
  }

  const note = document.getElementById("calFilterNote");
  if (selectedDay) {
    const [y, m, d] = selectedDay.split("-");
    note.style.display = "block";
    note.innerHTML = `A mostrar apenas ${d}/${m}. <button id="calClearFilter">Ver tudo</button>`;
    document.getElementById("calClearFilter").onclick = () => { selectedDay = null; render(); };
  } else {
    note.style.display = "none";
  }
}

document.getElementById("calPrev").onclick = () => {
  calendarMonth.setMonth(calendarMonth.getMonth() - 1);
  renderCalendar();
};
document.getElementById("calNext").onclick = () => {
  calendarMonth.setMonth(calendarMonth.getMonth() + 1);
  renderCalendar();
};

const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value;
  render();
});

// Formulário
const formCard = document.getElementById("formCard");
const addBtn = document.getElementById("addBtn");
const fTitle = document.getElementById("fTitle");
const fSubject = document.getElementById("fSubject");
const fType = document.getElementById("fType");
const fPriority = document.getElementById("fPriority");
const fDate = document.getElementById("fDate");
const saveBtn = document.getElementById("saveBtn");

function checkValid() {
  saveBtn.disabled = !(fTitle.value.trim() && fSubject.value.trim() && fDate.value);
}
[fTitle, fSubject, fDate].forEach(el => el.addEventListener("input", checkValid));

addBtn.onclick = () => { formCard.style.display = "block"; addBtn.style.display = "none"; };
document.getElementById("closeForm").onclick = closeForm;
function closeForm() {
  formCard.style.display = "none"; addBtn.style.display = "flex";
  fTitle.value = ""; fSubject.value = ""; fType.value = "trabalho"; fPriority.value = "media"; fDate.value = "";
  checkValid();
}
saveBtn.onclick = () => {
  if (saveBtn.disabled) return;
  const newTask = {
    id: Date.now().toString(),
    title: fTitle.value.trim(),
    subject: fSubject.value.trim(),
    type: fType.value,
    dueDate: fDate.value,
    priority: fPriority.value,
    done: false
  };
  tasks.push(newTask);
  syncTaskRemote(newTask);
  closeForm();
  save();
};

window.addEventListener("online", () => document.getElementById("offlineBanner").style.display = "none");
window.addEventListener("offline", () => document.getElementById("offlineBanner").style.display = "block");
if (!navigator.onLine) document.getElementById("offlineBanner").style.display = "block";

let swRegistration = null;
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(reg => { swRegistration = reg; })
      .catch(() => {});
  });
}

// Lembretes
const REMINDER_KEY = "planeador-reminders-enabled";
const LAST_NOTIFIED_KEY = "planeador-last-notified";
const bellBtn = document.getElementById("bellBtn");
const reminderInfo = document.getElementById("reminderInfo");

function remindersEnabled() { return localStorage.getItem(REMINDER_KEY) === "1"; }

function updateBellUI() {
  const supported = "Notification" in window;
  if (!supported) {
    bellBtn.style.display = "none";
    return;
  }
  const on = remindersEnabled() && Notification.permission === "granted";
  bellBtn.classList.toggle("on", on);
  bellBtn.textContent = on ? "🔔 Lembretes ativos" : "🔕 Lembretes";
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function subscribeToPush() {
  if (!swRegistration || !("PushManager" in window) || !supabaseReady) return;
  try {
    let sub = await swRegistration.pushManager.getSubscription();
    if (!sub) {
      sub = await swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    const json = sub.toJSON();
    await supabaseRequest("push_subscriptions?on_conflict=endpoint", {
      method: "POST",
      prefer: "resolution=merge-duplicates",
      body: JSON.stringify([{ endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth, user_id: getUserId() }]),
    });
  } catch (e) {
    // subscrição push falhou (browser não suporta, ou Supabase por configurar) — os lembretes locais continuam a funcionar
  }
}

bellBtn && bellBtn.addEventListener("click", async () => {
  if (!("Notification" in window)) return;

  if (remindersEnabled() && Notification.permission === "granted") {
    localStorage.setItem(REMINDER_KEY, "0");
    reminderInfo.style.display = "none";
    updateBellUI();
    return;
  }

  if (Notification.permission === "denied") {
    reminderInfo.style.display = "block";
    reminderInfo.textContent = "As notificações estão bloqueadas nas definições do telemóvel/browser para este site. Ativa-as manualmente para receberes lembretes.";
    return;
  }

  const perm = await Notification.requestPermission();
  if (perm === "granted") {
    localStorage.setItem(REMINDER_KEY, "1");
    reminderInfo.style.display = "block";
    reminderInfo.textContent = supabaseReady
      ? "Lembretes ativados — vais receber um aviso mesmo com a app fechada, uma vez por dia."
      : "Lembretes ativados. Vais ver um aviso sempre que abrires a app e houver algo a vencer hoje ou amanhã.";
    checkAndNotify(true);
    subscribeToPush();
  }
  updateBellUI();
});

function checkAndNotify(force) {
  if (!remindersEnabled() || Notification.permission !== "granted") return;

  const today = new Date().toISOString().slice(0, 10);
  if (!force && localStorage.getItem(LAST_NOTIFIED_KEY) === today) return;

  const urgent = tasks.filter(t => !t.done && daysUntil(t.dueDate) <= 1 && daysUntil(t.dueDate) >= 0);
  if (urgent.length === 0) return;

  const title = urgent.length === 1 ? "1 item para breve" : `${urgent.length} itens para breve`;
  const body = urgent.map(t => `${t.title} — ${formatDue(t.dueDate)}`).join("\n");

  if (swRegistration && swRegistration.showNotification) {
    swRegistration.showNotification(title, { body, icon: "icon-192.png", badge: "icon-192.png" });
  } else {
    new Notification(title, { body, icon: "icon-192.png" });
  }
  localStorage.setItem(LAST_NOTIFIED_KEY, today);
}

function initApp() {
  syncFromRemote();
  updateBellUI();
  render();
  checkAndNotify(false);
  if (remindersEnabled() && Notification.permission === "granted") {
    setTimeout(subscribeToPush, 1000); // dá tempo ao service worker para registar
  }
}

async function syncFromRemote() {
  if (!supabaseReady) return;
  try {
    const res = await supabaseRequest("tasks?select=*");
    if (!res || !res.ok) return;
    const remoteTasks = await res.json();
    const localIds = new Set(tasks.map(t => t.id));
    let changed = false;
    remoteTasks.forEach(rt => {
      if (!localIds.has(rt.id)) {
        tasks.push({
          id: rt.id, title: rt.title, subject: rt.subject, type: rt.type,
          dueDate: rt.due_date, priority: rt.priority, done: rt.done,
        });
        changed = true;
      }
    });
    if (changed) save(); else render();
  } catch (e) {}
}

// -- Ecrã de login --
const loginScreen = document.getElementById("loginScreen");
const appScreen = document.getElementById("appScreen");
const loginBtn = document.getElementById("loginBtn");
const loginEmail = document.getElementById("loginEmail");
const loginPassword = document.getElementById("loginPassword");
const loginError = document.getElementById("loginError");
const logoutBtn = document.getElementById("logoutBtn");
let appStarted = false;

function showApp() {
  loginScreen.style.display = "none";
  appScreen.style.display = "block";
  if (!appStarted) { appStarted = true; initApp(); }
}
function showLogin(message) {
  appScreen.style.display = "none";
  loginScreen.style.display = "flex";
  if (message) {
    loginError.style.display = "block";
    loginError.textContent = message;
  }
}

loginBtn.addEventListener("click", async () => {
  const email = loginEmail.value.trim();
  const password = loginPassword.value;
  if (!email || !password) return;
  loginBtn.disabled = true;
  loginError.style.display = "none";
  try {
    await login(email, password);
    showApp();
  } catch (e) {
    loginError.style.display = "block";
    loginError.textContent = e.message || "Não foi possível entrar.";
  }
  loginBtn.disabled = false;
});
loginPassword.addEventListener("keydown", (e) => { if (e.key === "Enter") loginBtn.click(); });

logoutBtn.addEventListener("click", () => {
  clearSession();
  loginEmail.value = "";
  loginPassword.value = "";
  appStarted = false;
  showLogin();
});

(async function boot() {
  if (!supabaseReady) { showApp(); return; }
  const session = await ensureSession();
  if (session) showApp(); else showLogin();
})();
</script>
